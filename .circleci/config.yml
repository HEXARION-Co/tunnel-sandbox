version: 2.1

jobs:
  linux-tests:
    docker:
      - image: python:3.12.15-bookworm@sha256:df4ff62a10e40bb76b1f0a8a048bc35f8cd7b8ad61679885ff63e584a4fd96f1
    resource_class: small
    working_directory: /tmp/tunnel-sandbox
    environment:
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - checkout
      - run:
          name: Compile
          command: python -m py_compile sandbox/*.py tests/*.py
      - run:
          name: Unit tests
          command: python -m unittest discover -s tests -v

workflows:
  validate:
    jobs:
      - linux-tests
